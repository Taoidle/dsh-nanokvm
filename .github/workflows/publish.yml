# Publish to npm when a version tag is pushed.
#
#   1. bump "version" in package.json and add a CHANGELOG entry
#   2. git tag v0.2.1 && git push origin v0.2.1
#
# Requires the repository secret NPM_TOKEN (an npm automation token). Without
# it the run is skipped with a warning instead of failing: the tag itself is
# still a valid release marker.
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - id: gate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set — nothing was published"
          fi
      # Only the schema library is needed to run the suite; the other imports
      # are provided by the harness at runtime.
      - if: steps.gate.outputs.ok == '1'
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/schemastery@^3.18.4
      - if: steps.gate.outputs.ok == '1'
        run: npm run check && npm test
      - if: steps.gate.outputs.ok == '1'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
